openapi: 3.0.3
info:
  title: Bookstore E-Commerce Platform Backend API
  version: 1.0.0
  description: >
    Complete OpenAPI 3.0.3 Specification for the Bookstore E-Commerce Platform Backend.
    Covers all 6 core business domains: Member & Identity, Store & Policy, Catalog & Recommendations,
    Cart & Orders, Payment & Wallet, and Shipping & Logistics.
servers:
  - url: http://localhost:3000
    description: Local Development & Deployment Server

tags:
  - name: Member & Identity
    description: User registration, authentication, RBAC, address management, and entitlements.
  - name: Store & Governance
    description: Storefront configurations, catalog mappings, and operational business policies.
  - name: Catalog & Recommendations
    description: Category hierarchies, book discovery, faceted filtering, recommendations, and upsells.
  - name: Cart & Orders
    description: Guest and member cart operations, promo coupons, gift points, and order state lifecycle.
  - name: Payment & Wallet
    description: Payment processing, digital wallet balances, transaction ledgers, and refund workflows.
  - name: Shipping & Logistics
    description: Dynamic shipping rates, SLA estimation, shipment tracking, and reverse return logistics.

paths:
  # ==========================================
  # MEMBER & IDENTITY DOMAIN
  # ==========================================
  /api/v1/members/register:
    post:
      tags:
        - Member & Identity
      summary: Register a new customer
      description: Creates a new user profile with welcome wallet credits and returns an authenticated JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: Password@123
                fullName:
                  type: string
                  example: John Doe
                entitlementTier:
                  type: string
                  enum: [STANDARD, VIP, STUDENT, WHOLESALE]
                  default: STANDARD
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Missing required fields
        '409':
          description: User with this email already exists

  /api/v1/members/login:
    post:
      tags:
        - Member & Identity
      summary: Authenticate user & generate JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  example: User@123
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid email or password

  /api/v1/members/profile:
    get:
      tags:
        - Member & Identity
      summary: Get current authenticated member profile & wallet
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved
        '401':
          description: Unauthorized
    put:
      tags:
        - Member & Identity
      summary: Update member profile details
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: Jane Doe
                entitlementTier:
                  type: string
                  enum: [STANDARD, VIP, STUDENT, WHOLESALE]
      responses:
        '200':
          description: Profile updated

  /api/v1/members/addresses:
    get:
      tags:
        - Member & Identity
      summary: List user saved shipping & billing addresses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of addresses
    post:
      tags:
        - Member & Identity
      summary: Add a new address
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Address created

  # ==========================================
  # STORE & GOVERNANCE DOMAIN
  # ==========================================
  /api/v1/stores:
    get:
      tags:
        - Store & Governance
      summary: List all active store instances
      responses:
        '200':
          description: Array of stores
    post:
      tags:
        - Store & Governance
      summary: Create a new store profile (Admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name:
                  type: string
                  example: Grand Central Books
                code:
                  type: string
                  example: GCB-US
                currency:
                  type: string
                  default: USD
                locale:
                  type: string
                  default: en-US
                supportEmail:
                  type: string
                  example: support@gcb.com
      responses:
        '201':
          description: Store created

  /api/v1/stores/{id}:
    get:
      tags:
        - Store & Governance
      summary: Get store details, operational policies, and catalog mappings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: STORE_MAIN
      responses:
        '200':
          description: Store details
        '404':
          description: Store not found

  /api/v1/stores/{id}/policies:
    put:
      tags:
        - Store & Governance
      summary: Update store business policies (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                returnWindowDays:
                  type: integer
                  example: 14
                cancellationWindowHours:
                  type: integer
                  example: 24
                freeShippingThreshold:
                  type: number
                  example: 50.0
                taxRatePercent:
                  type: number
                  example: 8.0
                allowGuestCheckout:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Policies updated

  # ==========================================
  # CATALOG & RECOMMENDATION DOMAIN
  # ==========================================
  /api/v1/catalog/categories:
    get:
      tags:
        - Catalog & Recommendations
      summary: List all product categories & taxonomy
      responses:
        '200':
          description: Categories list
    post:
      tags:
        - Catalog & Recommendations
      summary: Create category (Catalog Manager / Admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                parentId:
                  type: string
      responses:
        '201':
          description: Category created

  /api/v1/catalog/products:
    get:
      tags:
        - Catalog & Recommendations
      summary: Search and browse products with dynamic faceting & entitlement filtering
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Keyword search on title, author, isbn, description
        - name: categoryId
          in: query
          schema:
            type: string
        - name: author
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [HARDCOVER, PAPERBACK, EBOOK, AUDIOBOOK]
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, rating, newest]
      responses:
        '200':
          description: Filtered product catalogue with facets
    post:
      tags:
        - Catalog & Recommendations
      summary: Create new book product (Catalog Manager / Admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created

  /api/v1/catalog/products/{id}:
    get:
      tags:
        - Catalog & Recommendations
      summary: Product details with associated Cross-sell & Up-sell recommendations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details and related upsell items
        '404':
          description: Product not found

  /api/v1/catalog/recommendations:
    get:
      tags:
        - Catalog & Recommendations
      summary: Personalized product recommendations based on order history
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Recommended books tailored to user purchase patterns

  # ==========================================
  # CART & ORDER DOMAIN
  # ==========================================
  /api/v1/orders/cart:
    get:
      tags:
        - Cart & Orders
      summary: Get active cart for current user or guest session
      parameters:
        - name: x-guest-session-id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Cart details with pricing calculations

  /api/v1/orders/cart/items:
    post:
      tags:
        - Cart & Orders
      summary: Add, update quantity, or remove item from cart
      parameters:
        - name: x-guest-session-id
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: string
                  example: prod_1
                quantity:
                  type: integer
                  example: 2
      responses:
        '200':
          description: Cart updated

  /api/v1/orders/cart/merge:
    post:
      tags:
        - Cart & Orders
      summary: Merge guest session cart into logged-in user cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guestSessionId]
              properties:
                guestSessionId:
                  type: string
      responses:
        '200':
          description: Carts merged successfully

  /api/v1/orders/cart/apply-coupon:
    post:
      tags:
        - Cart & Orders
      summary: Apply promo coupon code and/or redeem loyalty gift points
      parameters:
        - name: x-guest-session-id
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                couponCode:
                  type: string
                  example: WELCOME10
                redeemPoints:
                  type: integer
                  example: 50
      responses:
        '200':
          description: Discount applied

  /api/v1/orders/checkout:
    post:
      tags:
        - Cart & Orders
      summary: Checkout cart, validate & reserve inventory, create pending order
      parameters:
        - name: x-guest-session-id
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress, billingAddress]
              properties:
                storeId:
                  type: string
                  example: STORE_MAIN
                guestEmail:
                  type: string
                  example: guest@example.com
                shippingMethodTier:
                  type: string
                  enum: [STANDARD, EXPRESS, OVERNIGHT]
                  default: STANDARD
                shippingAddress:
                  $ref: '#/components/schemas/AddressInput'
                billingAddress:
                  $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Order created and ready for payment

  /api/v1/orders/history:
    get:
      tags:
        - Cart & Orders
      summary: Order history for authenticated member
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of historical orders

  /api/v1/orders/{id}:
    get:
      tags:
        - Cart & Orders
      summary: Order details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
        '404':
          description: Order not found

  /api/v1/orders/{id}/cancel:
    post:
      tags:
        - Cart & Orders
      summary: Cancel order and restock reserved inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order cancelled and inventory restored

  /api/v1/orders/{id}/return:
    post:
      tags:
        - Cart & Orders
      summary: Initiate return request for delivered order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Defective cover page
      responses:
        '200':
          description: Return requested

  # ==========================================
  # PAYMENT & WALLET DOMAIN
  # ==========================================
  /api/v1/payments/process:
    post:
      tags:
        - Payment & Wallet
      summary: Authorize and capture payment (Card, Gateway, or Wallet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, paymentMethod]
              properties:
                orderId:
                  type: string
                  example: ORD-1741349888-123
                paymentMethod:
                  type: string
                  enum: [CREDIT_CARD, DEBIT_CARD, NET_BANKING, WALLET, GIFT_CARD]
      responses:
        '200':
          description: Payment successful and order confirmed

  /api/v1/payments/refund:
    post:
      tags:
        - Payment & Wallet
      summary: Process refund for cancelled or returned orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
                amount:
                  type: number
                refundMethod:
                  type: string
                  enum: [ORIGINAL_PAYMENT, WALLET]
                reason:
                  type: string
      responses:
        '200':
          description: Refund processed

  /api/v1/payments/wallet:
    get:
      tags:
        - Payment & Wallet
      summary: Get authenticated member wallet balance & transaction ledger
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wallet and ledger details

  /api/v1/payments/wallet/topup:
    post:
      tags:
        - Payment & Wallet
      summary: Top-up wallet credit balance
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  example: 50.0
      responses:
        '200':
          description: Wallet topped up

  # ==========================================
  # SHIPPING & FULFILLMENT DOMAIN
  # ==========================================
  /api/v1/shipping/methods:
    get:
      tags:
        - Shipping & Logistics
      summary: List available shipping carriers and baseline tiers
      responses:
        '200':
          description: Shipping methods

  /api/v1/shipping/calculate-rates:
    post:
      tags:
        - Shipping & Logistics
      summary: Calculate dynamic delivery rates and Estimated Delivery Dates (EDD)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postalCode]
              properties:
                postalCode:
                  type: string
                  example: "94103"
                country:
                  type: string
                  example: "USA"
                weightKg:
                  type: number
                  example: 1.5
                orderTotal:
                  type: number
                  example: 65.0
      responses:
        '200':
          description: Dynamic rates with estimated delivery date ranges

  /api/v1/shipping/track/{trackingNumber}:
    get:
      tags:
        - Shipping & Logistics
      summary: Track forward package or reverse return transit in real time
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
            example: TRK-A1B2C3D4
      responses:
        '200':
          description: Tracking event timeline
        '404':
          description: Tracking number not found

  /api/v1/shipping/returns:
    post:
      tags:
        - Shipping & Logistics
      summary: Generate return shipment label and tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Return label generated

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AddressInput:
      type: object
      required: [street, city, postalCode, country]
      properties:
        fullName:
          type: string
          example: John Doe
        type:
          type: string
          enum: [SHIPPING, BILLING]
          default: SHIPPING
        street:
          type: string
          example: 123 Market St
        city:
          type: string
          example: San Francisco
        state:
          type: string
          example: CA
        postalCode:
          type: string
          example: "94103"
        country:
          type: string
          example: USA
        phone:
          type: string
          example: "+1-555-0199"
        isDefault:
          type: boolean
          default: false

    ProductInput:
      type: object
      required: [title, isbn, author, price]
      properties:
        title:
          type: string
          example: Designing Data-Intensive Applications
        isbn:
          type: string
          example: 978-1449373320
        author:
          type: string
          example: Martin Kleppmann
        publisher:
          type: string
          example: O'Reilly Media
        publicationYear:
          type: integer
          example: 2017
        format:
          type: string
          enum: [HARDCOVER, PAPERBACK, EBOOK, AUDIOBOOK]
          default: HARDCOVER
        categoryId:
          type: string
          example: cat_tech
        price:
          type: number
          example: 49.99
        stockQuantity:
          type: integer
          default: 50
        rating:
          type: number
          default: 4.8
        description:
          type: string
        imageUrl:
          type: string
        entitlementAccess:
          type: string
          enum: [ALL, VIP_ONLY, STUDENT_ONLY]
          default: ALL
        relatedProductIds:
          type: array
          items:
            type: string
